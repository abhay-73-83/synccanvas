name: Build & Release

on:
  pull_request:
    branches:
      - main
      - master

  push:
    branches:
      - main
      - master
      - develop

jobs:
  build:
    name: Build & Release
    runs-on: macos-latest

    steps:
      # Checkout source code
      - name: Checkout
        uses: actions/checkout@v4

      # Setup Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'

      # Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
          cache: true

      # Check versions
      - name: Check Flutter & Java versions
        run: |
          flutter --version
          java -version

      # Install dependencies
      - name: Flutter Pub Get
        run: flutter pub get

      # Build Android APK
      - name: Build Android APK
        run: flutter build apk --release --split-per-abi

      # Build iOS
      - name: Build iOS
        run: flutter build ios --release --no-codesign

      # Create IPA
      - name: Create IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cd Payload
          ln -s ../Runner.app
          cd ..
          zip -r app.ipa Payload

      # Push build to GitHub Release
      - name: Push to Releases
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/apk/release/*,build/ios/iphoneos/app.ipa"
          tag: v1.0.${{ github.run_number }}
          token: ${{ secrets.SYNCCANVAS_TOKEN }}